# Bauen und Testen bei jedem Push (docs/plans/RELEASE-PLAN.md R7).
#
# Der eigentliche Gewinn steht in einer Zeile: "runs-on: windows-latest" ist
# ECHTE x64-Hardware. Die Entwicklungsmaschine ist ARM64 und laesst x64 nur
# emuliert laufen (ADR-001) — hier bauen und testen wir erstmals auf der
# Zielarchitektur.
#
# Das ersetzt AP7.8 und T38 nicht: kein Audiogeraet, keine Telefonanlage, keine
# Laufzeitmessung unter Last. Aber der ungemessene Rest wird kleiner, und zwar
# ohne dass jemand ein Geraet organisieren muss.

name: Bauen und Testen

on:
  push:
    branches: [main, review-umsetzung]
  pull_request:
  workflow_dispatch:

env:
  # Das SDK liegt nicht im Repo (299 MB, gitignoriert). Version, Adresse und
  # Pruefsumme stehen in docs/sdk-setup.md und hier — beide Stellen gehoeren
  # zusammen gepflegt.
  #
  # GEHOLT WIRD AUS DEM EIGENEN ABHAENGIGKEITS-REPO, nicht von
  # download.linphone.org. Dort lag ab dem 07.09.2026 eine ANDERE Datei unter
  # derselben Adresse und derselben Versionsnummer (198 342 Bytes mehr) — ein
  # stilles Neuablegen desselben Release. Jeder CI-Lauf brach seither an der
  # Pruefsumme ab, noch bevor PublicRepositoryTests lief. Die Pruefsumme
  # nachzuziehen waere die falsche Antwort gewesen: sie ist die Kontrolle
  # dagegen, dass ein unbesehen veraendertes SDK in den Build kommt.
  LINPHONE_SDK_VERSION: 5.5.18
  LINPHONE_SDK_URL: https://github.com/bv2-GmbH/nipp-build-deps/releases/download/linphone-sdk-5.5.18/linphone-sdk-win64-5.5.18.zip
  LINPHONE_SDK_SHA256: 4C69440CFFD843DA324C7AEDA9A2EA54C9E699AE199AB0A9F102AC26F55BE023

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 299 MB bei jedem Lauf neu zu holen waere Verschwendung — und der
      # Download-Server ist unzuverlaessig (ADR-005). Der Cache haengt an der
      # Version, ein SDK-Wechsel zieht ihn also automatisch neu.
      - name: SDK aus dem Cache
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: sdk/extracted
          key: linphone-sdk-${{ env.LINPHONE_SDK_VERSION }}

      - name: SDK beschaffen
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path sdk | Out-Null
          $zip = 'sdk/linphone-sdk.zip'
          Invoke-WebRequest -Uri $env:LINPHONE_SDK_URL -OutFile $zip

          # Ohne Version, Hash und Bezugsdatum weiss in sechs Monaten niemand
          # mehr, welcher SDK-Stand in einem Build war (docs/sdk-setup.md).
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($hash -ne $env:LINPHONE_SDK_SHA256) {
            throw "Pruefsumme stimmt nicht. Erwartet $env:LINPHONE_SDK_SHA256, erhalten $hash."
          }

          Expand-Archive -Path $zip -DestinationPath sdk/extracted -Force
          Remove-Item $zip

      - name: Bauen
        run: dotnet build Nipp.sln -c Release

      - name: Testen
        run: dotnet test Nipp.sln -c Release --no-build --verbosity normal
